[package]
name = "oracle"
version = "0.1.0"
edition = "2021"
authors = ["0xsteins"]
license = "MIT"
rust-version.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "oracle"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "test-util"] }
tokio-util = "0.7"
tower-http = { version = "0.7", features = ["cors", "trace", "request-id"] }
uuid = { version = "1", features = ["v4", "fast-rng"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = "2.1"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dotenvy = "0.15"
shared-config = { path = "../shared/config" }
stellar-rpc-client = "27.0.0"
# All base64 encoding/decoding in this crate goes through the standalone
# `base64` crate below (see chain/tx_builder.rs); stellar-xdr's own
# `to_xdr_base64`/`from_xdr_base64` helpers are never called, so the
# `base64` feature only adds a redundant dependency edge (#815).
stellar-xdr = { version = "27", features = ["std"] }
stellar-strkey = "0.0.18"
base64 = "0.22"
sha2 = "0.10"
digest = "0.10"
rand = "0.8"


[dev-dependencies]
futures = "0.3"
wiremock = "0.6"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
predicates = "3.0"
