[package]
name = "oracle"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "oracle"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
tokio-util = "0.7"
tower-http = { version = "0.7", features = ["cors", "trace", "request-id", "set-header", "catch-panic"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = "2.1"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dotenvy = "0.15"
shared-config = { version = "0.1.0", path = "../shared/config" }
# `from_xdr_base64` is used by the bad-sequence XDR detection in keeper_loop.rs.
stellar-xdr = { version = "27", features = ["std", "base64"] }
stellar-strkey = "0.0.18"
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
# price_loop.rs joins concurrent token fetches in non-test code.
futures = "0.3"

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["full", "test-util"] }
tower = { version = "0.5", features = ["util"] }
predicates = "3.0"
