[workspace]
members = ["oracle", "shared/config"]
resolver = "2"

[workspace.package]
rust-version = "1.95"

[workspace.lints.rust]
# Allow during the Rust 2024 migration while dependencies and generated code settle on one lifetime spelling.
mismatched_lifetime_syntaxes = "allow"

# Aligned with railway.json healthcheck: setting healthcheckPath to /ready
# ensures the probe reflects real liveness (/ready inspects state.cycle_status).
# panic is left as "unwind" (the default) so tokio task panics in price_loop/keeper_loop
# are captured as JoinErrors in main.rs's select! block, enabling graceful shutdown
# and structured panic error logging before exit. (#962)
[profile.release]
overflow-checks = true


