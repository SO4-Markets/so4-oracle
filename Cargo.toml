[workspace]
members = ["oracle", "shared/config"]
resolver = "2"

[workspace.package]
rust-version = "1.95"

[workspace.lints.rust]
# Allow during the Rust 2024 migration while dependencies and generated code settle on one lifetime spelling.
mismatched_lifetime_syntaxes = "allow"

# Aligned with railway.json healthcheck: setting healthcheckPath to /ready
# ensures the probe reflects real liveness (/ready inspects state.cycle_status).
# Using panic = "unwind" ensures that panics inside inbound HTTP request handlers
# are caught by tower_http's CatchPanicLayer (preventing remote DoS, #1044) and
# background task panics can be observed and gracefully drained in main.rs (#962).
[profile.release]
overflow-checks = true
panic = "unwind"


